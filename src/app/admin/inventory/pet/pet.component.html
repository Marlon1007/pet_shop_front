<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton type="button" label="New" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
        </ng-template>
        <ng-template pTemplate="right">
            <button pButton type="button" label="Export" icon="pi pi-upload" class="p-button-help" (click)="dt.exportCSV()"></button>
        </ng-template>
    </p-toolbar>
    <p-table #dt [value]="pets" [columns]="cols" responsiveLayout="scroll" [rows]="10" [paginator]="true"
        [rowsPerPageOptions]="[10, 20, 30]" [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} pets" dataKey="id">
        <ng-template pTemplate="caption"><h2 class="m-0">Manage pets</h2></ng-template>
        <ng-template pTemplate="header">
            <tr><th>ID</th><th>Name</th><th>Image</th><th>Breed</th><th>Age</th><th>Gender</th><th>Status</th><th>Actions</th></tr>
        </ng-template>
        <ng-template pTemplate="body" let-pet>
            <tr>
                <td>{{ pet.id }}</td><td>{{ pet.name }}</td>
                <td><img [src]="pet.image" [alt]="pet.name" width="80"></td>
                <td>{{ pet.breed }}</td><td>{{ pet.age }}</td><td>{{ pet.gender }}</td><td>{{ pet.status }}</td>
                <td>
                    <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" aria-label="Edit pet" (click)="editPet(pet)"></button>
                    <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-warning" aria-label="Delete pet" (click)="deletePet(pet)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
